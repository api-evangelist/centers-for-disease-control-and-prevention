  note: >-
    The public data APIs answer anonymously. A free Socrata application token
    (https://dev.socrata.com/docs/app-tokens.html) is optional and only lifts IP throttling.
    CDC WONDER requires no account but does require accept_datause_restrictions=true on every
    request.
