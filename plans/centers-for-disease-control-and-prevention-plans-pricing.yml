description: >-
  CDC PUBLISHES NO PLANS AND NO PRICING, and that is the finding — not a gap in this pass. Every
  CDC API in this record is a free, public, US-government data service: data.cdc.gov and
  chronicdata.cdc.gov (Socrata SODA), CDC WONDER, the Environmental Public Health Tracking
  Network API, and the Content Syndication API at tools.cdc.gov. There is no paid tier, no
  overage, no metered quota and no billing relationship of any kind. Most CDC datasets are
  dedicated to the public domain (CC0 1.0); the DIBBs products are Apache-2.0 and CC0. The only
  thing resembling an account is the free Socrata application token, which buys higher throughput
  rather than access, and costs nothing.
free_tier:
  exists: true
