test_data:
  - name: DIBBs Star Wars eCR data
    url: https://github.com/CDCgov/dibbs-star-wars-ecr-data
    license: Apache-2.0
    updated: '2026-07-09'
    description: >-
      CDC-published synthetic eICR/RR documents built around Star Wars characters, so no real
      patient data is ever needed to exercise the eCR pipeline. This is CDC's equivalent of a
      test-card table.
  - name: Query Connector example FHIR Patient
    source: openapi/centers-for-disease-control-and-prevention-dibbs-query-connector-openapi.yaml
    description: >-
      The /api/query requestBody carries a complete example US Core Patient resource (Lee Shaw,
      MRN 8692756, DOB 1975-12-06) that can be posted verbatim against the demo instance.
    note: Values quoted from CDC's own published spec; not invented here.
simulator:
  surface: DIBBs eCR Refiner
  endpoints:
    - "POST /api/v1/simulator/upload (uploadEcr)"
    - "POST /api/v1/simulator/discover-configurations (discoverConfigurations)"
    - "POST /api/v1/configurations/test (runInlineConfigurationTest)"
    - "POST /api/v1/configurations/{configuration_id}/custom-codes/validate (validateCustomCodeFromConfiguration)"
  description: >-
    A first-class rehearsal surface: upload an eCR, discover which configurations would match,
    and test a configuration inline without activating it. Custom-code uploads are two-phase
    (upload then confirm), so a CSV can be inspected before it lands.
local_credentials:
  surface: DIBBs eCR Refiner local Docker Compose
  url: http://localhost:8081/
  note: >-
    The repository README publishes seed logins for the locally-seeded database (a `refiner`
    user and a `refiner2` secondary user, each with a matching password). They exist only in the
    local development container and grant nothing on any CDC host; they are recorded here as
    documentation of the local test path, not as credentials.
  source: https://github.com/CDCgov/dibbs-ecr-refiner
socrata_evergreen:
  url: https://evergreen.data.socrata.com/signup
  note: >-
    The application-token signup CDC's SODA docs link to is hosted by the platform vendor
    (Socrata / Tyler Data & Insights), not by CDC. It issues a token usable across Socrata
    portals including data.cdc.gov.
