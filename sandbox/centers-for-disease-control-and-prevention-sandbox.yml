method: searched
source: >-
  https://github.com/CDCgov/dibbs-ecr-refiner (README, read 2026-09-05),
  https://github.com/CDCgov/dibbs-star-wars-ecr-data,
  https://connector.dibbs.tools, https://queryconnector.dev,
  openapi/centers-for-disease-control-and-prevention-dibbs-ecr-refiner-openapi.json
description: >-
  CDC operates no sandbox for its public data APIs — none is needed, because they are read-only,
  anonymous and free, so production IS the test environment. The DIBBs product line is different:
  it ships hosted demo and dev instances, a synthetic patient-data corpus, an in-product
  simulator, and local seed credentials, all published by CDC.
public_data_apis:
  sandbox: none
  reason: >-
    SODA, CDC WONDER, the Tracking Network API and Content Syndication are read-only queries over
    published public-domain data with no authentication and no cost. There is nothing to
    simulate. A caller can safely exercise every operation against the live host.
  safe_probe_examples:
    - "GET https://data.cdc.gov/resource/9mfq-cb36.json?$limit=1"
    - "GET https://tools.cdc.gov/api/v2/resources/media?max=1"
    - "GET https://ephtracking.cdc.gov/apigateway/api/v1/contentareas/json"
    - "GET https://data.cdc.gov/data.json"
