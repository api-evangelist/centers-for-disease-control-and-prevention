method: searched
source: >-
  npm registry metadata (registry.npmjs.org) for the @cdc and @us-gov-cdc scopes, plus the
  GitHub Container Registry build published by CDCgov/dibbs-ecr-refiner. Scope ownership was
  confirmed by each package's repository field resolving to a github.com/CDCgov repo.
note: >-
  CDC publishes no first-party client SDK for its public data APIs (SODA / data.cdc.gov,
  CDC WONDER, the Environmental Public Health Tracking API, or the Content Syndication API).
  Third-party clients exist (for example the community `sodapy` package on PyPI, maintained by
  xmunoz, and `EPHTrackR`, an R interface published in CDCgov/EPHTrackR but never released to
  CRAN — crandb.r-pkg.org/EPHTrackR returned 404 on 2026-09-05). What CDC does publish to public
  registries is a front-end visualization component library and a containerized product build,
  both catalogued below.
