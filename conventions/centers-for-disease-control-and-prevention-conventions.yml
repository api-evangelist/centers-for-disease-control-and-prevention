    style: extension
    formats: [.json, .csv, .geojson, .xml, .rdf]
  - surface: Content Syndication
    style: extension-or-query
    formats: [.json, .xml, .jsonp]
    param: format
  - surface: CDC WONDER
    style: xml-post
    detail: 'POST request_xml=<request-parameters>…</request-parameters> to /controller/datarequest/{databaseId}; accept_datause_restrictions=true is mandatory on every call.'
