request_tracing:
  header: X-Socrata-RequestId
  surface: SODA
  observed: 'Response header on every data.cdc.gov request, e.g. 01c5ffd43400fc0d984fc65d09f39cb2 (2026-09-05)'
  note: >-
    This is the only request-correlation identifier CDC returns anywhere. tools.cdc.gov,
    ephtracking.cdc.gov and wonder.cdc.gov return no request id, so a caller has nothing to quote
    in a support ticket for those three surfaces.
versioning:
  cross_reference: lifecycle/centers-for-disease-control-and-prevention-lifecycle.yml
error_envelope:
  cross_reference: errors/centers-for-disease-control-and-prevention-problem-types.yml
  summary: >-
    Three incompatible envelopes; none is RFC 9457. The Content Syndication API returns HTTP 200
    with the error inside meta.status, which will silently pass a naive status-code check.
rate_limit_signaling:
  cross_reference: rate-limits/centers-for-disease-control-and-prevention-rate-limits.yml
  summary: >-
    No RateLimit-* or X-RateLimit-* headers were observed on ANY CDC surface on 2026-09-05.
    Socrata documents a 429 on exhaustion but returns no quota headers, so a caller cannot see
    how close to the limit it is until it is over it.
content_negotiation:
