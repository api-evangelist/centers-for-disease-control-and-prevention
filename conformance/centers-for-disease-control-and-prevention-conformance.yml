compliance:
  published_program: false
  note: >-
    CDC publishes no vendor-style trust center or certification page (SOC 2 / ISO 27001 / PCI).
    As a federal agency its posture is governed by FISMA/FedRAMP through its hosting providers —
    data.cdc.gov responses carry X-Socrata-Region: aws-us-east-1-fedramp-prod, which evidences the
    PLATFORM's FedRAMP boundary, not a CDC-published compliance program. No `Compliance` pointer
    is emitted on the strength of a response header.
