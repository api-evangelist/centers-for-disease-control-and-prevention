description: >-
  The Centers for Disease Control and Prevention (CDC) is the United States'
  national public health agency, part of the Department of Health and Human
  Services. CDC operates a broad portfolio of free, anonymously callable
  public APIs and open data services: the Socrata-powered data.cdc.gov and
  chronicdata.cdc.gov Open Data APIs, whose DCAT-US 1.1 catalog lists 1,385
  datasets covering COVID-19, chronic disease, environmental health,
  immunization, injury and mortality; the WONDER online query databases for
  mortality, natality and cancer statistics; the PLACES / BRFSS small-area
  estimates; the Environmental Public Health Tracking Network REST API; and
  the Content Syndication API at tools.cdc.gov. Alongside these, CDC ships
  open-source public health products with their own OpenAPI contracts under
  the CDCgov GitHub organization, notably the DIBBs eCR Refiner and the DIBBs
  Query Connector, a FHIR R4 / TEFCA query client. CDC's former developer
  portal open.cdc.gov has been decommissioned and no longer resolves, so the
  agency currently publishes no central API directory of its own.
apis:
- aid: centers-for-disease-control-and-prevention:cdc-socrata-open-data-api
  name: CDC Socrata Open Data API (data.cdc.gov)
  tags:
  - Chronic Disease
  - COVID-19
  - Datasets
  - Open Data
  - SODA
  - Socrata
  - Surveillance
  humanURL: https://data.cdc.gov/
  baseURL: https://data.cdc.gov/resource/
  properties:
  - url: https://data.cdc.gov/
    type: Website
  - url: https://dev.socrata.com/
    type: Documentation
  - url: https://dev.socrata.com/docs/endpoints.html
    type: Reference
  - url: https://dev.socrata.com/consumers/getting-started.html
    type: GettingStarted
  - url: https://evergreen.data.socrata.com/signup
    type: Signup
  description: >-
    The CDC Socrata Open Data API (SODA) provides programmatic JSON, CSV, and GeoJSON access to hundreds
    of data.cdc.gov datasets covering COVID-19 case surveillance, vaccination coverage, excess deaths,
    flu surveillance, PRAMStat, PLACES small-area estimates, environmental public health tracking, and
    chronic disease indicators. Supports SoQL filtering, aggregation, pagination, and authenticated app
    tokens for higher rate limits.
- aid: centers-for-disease-control-and-prevention:cdc-wonder-api
  name: CDC WONDER API
  tags:
  - Cancer
  - Mortality
  - Natality
  - Query Database
  - Statistics
  humanURL: https://wonder.cdc.gov/
  baseURL: https://wonder.cdc.gov/controller/datarequest/
  properties:
  - url: https://wonder.cdc.gov/
    type: Website
  - url: https://wonder.cdc.gov/wonder/help/wonder-api.html
    type: Documentation
  - url: https://wonder.cdc.gov/wonder/help/faq.html
    type: FAQ
  description: >-
    CDC WONDER (Wide-ranging ONline Data for Epidemiologic Research) is a suite of public-use ad-hoc query
    databases covering underlying and multiple cause of death, natality, cancer statistics, tuberculosis,
    STDs, vaccine adverse events, and environmental health indicators. WONDER exposes an XML-based HTTP
    API that accepts parameter documents and returns aggregate statistics suitable for epidemiologic research.
- aid: centers-for-disease-control-and-prevention:cdc-places-api
  name: CDC PLACES / 500 Cities API
  tags:
  - BRFSS
  - Census Tract
  - Chronic Disease
  - Health Indicators
  - Small Area Estimation
  humanURL: https://www.cdc.gov/places/
  baseURL: https://chronicdata.cdc.gov/resource/
  properties:
  - url: https://www.cdc.gov/places/
    type: Website
  - url: https://www.cdc.gov/places/methodology/
    type: Methodology
  - url: https://chronicdata.cdc.gov/
    type: OpenData
  description: >-
    PLACES (Population Level Analysis and Community Estimates) provides model-based small-area estimates
    for chronic disease risk factors, health outcomes, and prevention practices for counties, ZCTAs, census
    tracts, and places across the United States. Data is available via the Socrata chronicdata.cdc.gov
    portal as JSON, CSV, and GeoJSON endpoints.
- aid: centers-for-disease-control-and-prevention:cdc-ephtn-api
  name: CDC Environmental Public Health Tracking Network API
  tags:
  - Air Quality
  - Environmental Health
  - Exposure
  - GIS
  - Water Quality
  humanURL: https://ephtracking.cdc.gov/
  baseURL: https://ephtracking.cdc.gov:443/apigateway/api/v1
  properties:
  - url: https://ephtracking.cdc.gov/
    type: Website
  - url: https://ephtracking.cdc.gov/DataExplorer/
    type: Explorer
  description: >-
    The Environmental Public Health Tracking Network API provides a REST interface over the National Tracking
    Network's JSON-formatted data for air quality, water quality, climate and health, childhood lead poisoning,
    asthma, cancer, and other environmental health indicators at national, state, and county levels.
- aid: centers-for-disease-control-and-prevention:cdc-content-syndication
  name: CDC Public Health Media Library (Content Syndication)
