- aid: >-
    centers-for-disease-control-and-prevention:dibbs-ecr-refiner
  name: CDC DIBBs eCR Refiner API
  description: >-
    The DIBBs eCR Refiner reduces electronic initial case report (eICR) and Reportability Response
    (RR) documents down to the data a given reportable condition actually needs, easing storage and
    performance pressure on eCR pipelines and disease surveillance systems. CDC publishes a
    44-operation OpenAPI 3.1.0 contract covering conditions, configurations, custom code sets,
    section processing, an audit event log and an eCR simulator. The product is self-hosted: public
    health jurisdictions run the Apache-2.0 container from ghcr.io/cdcgov/dibbs-ecr-refiner, so the
    spec declares no servers[] block and the base URL is whatever the jurisdiction deploys.
  humanURL: https://github.com/CDCgov/dibbs-ecr-refiner
  tags:
  - eCR
  - eICR
  - HL7 CDA
  - Public Health Surveillance
  - Reportable Conditions
  properties:
  - type: OpenAPI
    url: openapi/centers-for-disease-control-and-prevention-dibbs-ecr-refiner-openapi.json
  - type: SourceCode
    url: https://github.com/CDCgov/dibbs-ecr-refiner
  - type: ChangeLog
    url: https://github.com/CDCgov/dibbs-ecr-refiner/releases
  - type: Overlay
    url: overlays/centers-for-disease-control-and-prevention-dibbs-ecr-refiner-overlay.yaml
- aid: >-
    centers-for-disease-control-and-prevention:dibbs-query-connector
  name: CDC DIBBs Query Connector API
  description: >-
    The DIBBs Query Connector is a FHIR client that lets public health agencies query health care
    organizations directly or through a TEFCA QHIN. Its published OpenAPI 3.0.3 contract exposes a
    health check and a query endpoint that accepts either a FHIR R4 patient resource or an HL7 v2
    message, with US Core race and ethnicity search parameters drawn from the CDC Race and Ethnicity
    code system. CDC runs a demo instance tracking the latest release and a dev instance tracking
    main; the product itself is self-hosted and CC0.
  humanURL: https://queryconnector.dev/
  baseURL: https://connector.dibbs.tools
  tags:
  - FHIR
  - HL7v2
  - Interoperability
  - Public Health Surveillance
  - TEFCA
  properties:
  - type: OpenAPI
    url: openapi/centers-for-disease-control-and-prevention-dibbs-query-connector-openapi.yaml
  - type: SourceCode
    url: https://github.com/CDCgov/dibbs-query-connector
