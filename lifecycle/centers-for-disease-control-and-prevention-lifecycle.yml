status_page_note: >-
  CDC operates no status page for its APIs. https://status.socrata.com/ ("Tyler Data & Insights
  System Status", HTTP 200 on 2026-09-05) covers the Socrata platform that data.cdc.gov and
  chronicdata.cdc.gov run on, but it is the VENDOR's page, not CDC's, and it says nothing about
  CDC WONDER, the Tracking Network API, or Content Syndication. No StatusPage pointer is emitted
  on the strength of a supplier's page.
retired_surfaces:
  - name: open.cdc.gov (CDC Open Technology developer portal and API index)
    status: decommissioned
    evidence: >-
      No DNS A record as of 2026-09-05 (NOERROR/NODATA under the cdc.gov SOA at both 8.8.8.8 and
      1.1.1.1); curl fails with "Could not resolve host". The site's source repository
      CDCgov/opencdc was ARCHIVED on 2024-03-21 and still carries the agency's own API index at
      _data/apis.yml.
    impact: >-
      CDC no longer publishes a developer portal or an API directory anywhere. This was the single
      entry point that told a developer which CDC APIs exist; nothing replaced it. Removed from
      apis.yml in this pass.
